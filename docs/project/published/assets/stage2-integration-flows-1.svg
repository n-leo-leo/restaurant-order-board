<svg xmlns="http://www.w3.org/2000/svg" width="2080" height="2381" viewBox="0 0 2080 2381"><title>Оплата и передача на кухню</title><metadata>Mermaid source SHA256: 365d1e02d88f0b3c82b7715272c8564e8cedbe9abfc7ce20fa0b54295dfa5104</metadata><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#526675"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="30" y="36" text-anchor="start" font-family="Arial, sans-serif" font-size="22" fill="#243746">Оплата и передача на кухню</text><line x1="160" y1="115" x2="160" y2="2281" stroke="#cad4dc" stroke-dasharray="5 5"/><rect x="52" y="65" width="216" height="44" rx="5" fill="#edf3f8" stroke="#526675"/><text x="160" y="93" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#243746">Гость</text><rect x="52" y="2291" width="216" height="44" rx="5" fill="#edf3f8" stroke="#526675"/><text x="160" y="2319" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#243746">Гость</text><line x1="410" y1="115" x2="410" y2="2281" stroke="#cad4dc" stroke-dasharray="5 5"/><rect x="302" y="65" width="216" height="44" rx="5" fill="#edf3f8" stroke="#526675"/><text x="410" y="93" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#243746">Киоск</text><rect x="302" y="2291" width="216" height="44" rx="5" fill="#edf3f8" stroke="#526675"/><text x="410" y="2319" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#243746">Киоск</text><line x1="660" y1="115" x2="660" y2="2281" stroke="#cad4dc" stroke-dasharray="5 5"/><rect x="552" y="65" width="216" height="44" rx="5" fill="#edf3f8" stroke="#526675"/><text x="660" y="93" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#243746">Приложение</text><rect x="552" y="2291" width="216" height="44" rx="5" fill="#edf3f8" stroke="#526675"/><text x="660" y="2319" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#243746">Приложение</text><line x1="910" y1="115" x2="910" y2="2281" stroke="#cad4dc" stroke-dasharray="5 5"/><rect x="802" y="65" width="216" height="44" rx="5" fill="#edf3f8" stroke="#526675"/><text x="910" y="93" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#243746">PostgreSQL</text><rect x="802" y="2291" width="216" height="44" rx="5" fill="#edf3f8" stroke="#526675"/><text x="910" y="2319" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#243746">PostgreSQL</text><line x1="1160" y1="115" x2="1160" y2="2281" stroke="#cad4dc" stroke-dasharray="5 5"/><rect x="1052" y="65" width="216" height="44" rx="5" fill="#edf3f8" stroke="#526675"/><text x="1160" y="93" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#243746">Склад</text><rect x="1052" y="2291" width="216" height="44" rx="5" fill="#edf3f8" stroke="#526675"/><text x="1160" y="2319" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#243746">Склад</text><line x1="1410" y1="115" x2="1410" y2="2281" stroke="#cad4dc" stroke-dasharray="5 5"/><rect x="1302" y="65" width="216" height="44" rx="5" fill="#edf3f8" stroke="#526675"/><text x="1410" y="93" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#243746">Эквайринг</text><rect x="1302" y="2291" width="216" height="44" rx="5" fill="#edf3f8" stroke="#526675"/><text x="1410" y="2319" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#243746">Эквайринг</text><line x1="1660" y1="115" x2="1660" y2="2281" stroke="#cad4dc" stroke-dasharray="5 5"/><rect x="1552" y="65" width="216" height="44" rx="5" fill="#edf3f8" stroke="#526675"/><text x="1660" y="93" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#243746">Обработчик</text><rect x="1552" y="2291" width="216" height="44" rx="5" fill="#edf3f8" stroke="#526675"/><text x="1660" y="2319" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#243746">Обработчик</text><line x1="1910" y1="115" x2="1910" y2="2281" stroke="#cad4dc" stroke-dasharray="5 5"/><rect x="1802" y="65" width="216" height="44" rx="5" fill="#edf3f8" stroke="#526675"/><text x="1910" y="93" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#243746">Комплекс</text><rect x="1802" y="2291" width="216" height="44" rx="5" fill="#edf3f8" stroke="#526675"/><text x="1910" y="2319" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#243746">Комплекс</text><text x="285.0" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#243746">Подтверждает состав и тип</text><polyline points="160,169 410,169" fill="none" stroke="#526675" stroke-width="1.6" marker-end="url(#arrow)"/><text x="535.0" y="212" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#243746">Подготовить покупку</text><polyline points="410,231 660,231" fill="none" stroke="#526675" stroke-width="1.6" marker-end="url(#arrow)"/><text x="785.0" y="274" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#243746">Сохранить снимок и намерение</text><text x="785.0" y="293" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#243746">резерва</text><polyline points="660,312 910,312" fill="none" stroke="#526675" stroke-width="1.6" marker-end="url(#arrow)"/><text x="910.0" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#243746">Зарезервировать весь состав с постоянным ID</text><polyline points="660,374 1160,374" fill="none" stroke="#526675" stroke-width="1.6" marker-end="url(#arrow)"/><text x="910.0" y="417" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#243746">Резерв и пригодность</text><polyline points="1160,436 660,436" fill="none" stroke="#526675" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="785.0" y="479" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#243746">Сохранить резерв</text><polyline points="660,498 910,498" fill="none" stroke="#526675" stroke-width="1.6" marker-end="url(#arrow)"/><text x="785.0" y="541" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#243746">Проверить продажи и сохранить</text><text x="785.0" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#243746">attemptId до банка</text><polyline points="660,579 910,579" fill="none" stroke="#526675" stroke-width="1.6" marker-end="url(#arrow)"/><text x="1035.0" y="622" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#243746">Начать оплату исходной попытки</text><polyline points="660,641 1410,641" fill="none" stroke="#526675" stroke-width="1.6" marker-end="url(#arrow)"/><text x="35" y="684" text-anchor="start" font-family="Arial, sans-serif" font-size="14" fill="#243746">alt Подтвержден успех</text><text x="1035.0" y="729" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#243746">Успех и внешний ID</text><polyline points="1410,748 660,748" fill="none" stroke="#526675" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="785.0" y="791" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#243746">Одна транзакция: оплата, номер,</text><text x="785.0" y="810" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#243746">jobId, документы, outbox</text><polyline points="660,829 910,829" fill="none" stroke="#526675" stroke-width="1.6" marker-end="url(#arrow)"/><text x="535.0" y="872" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#243746">Оплата сохранена, номер заказа</text><polyline points="660,891 410,891" fill="none" stroke="#526675" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="1285.0" y="934" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#243746">Получить исходное задание</text><polyline points="1660,953 910,953" fill="none" stroke="#526675" stroke-width="1.6" marker-end="url(#arrow)"/><text x="1410.0" y="996" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#243746">Проверить пригодность исходного резерва</text><polyline points="1660,1015 1160,1015" fill="none" stroke="#526675" stroke-width="1.6" marker-end="url(#arrow)"/><text x="53" y="1058" text-anchor="start" font-family="Arial, sans-serif" font-size="14" fill="#243746">alt Пригодность подтверждена</text><text x="1785.0" y="1103" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#243746">Отправить jobId и снимок</text><polyline points="1660,1122 1910,1122" fill="none" stroke="#526675" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="590" y="1150" width="1460" height="42" rx="4" fill="#fff7d6" stroke="#b8a15d"/><text x="1320.0" y="1170" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#243746">Проверка пригодности и первая отправка в пределах 1 с от подтверждения оплаты</text><text x="1785.0" y="1225" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#243746">Принят исходный jobId</text><polyline points="1910,1244 1660,1244" fill="none" stroke="#526675" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="1285.0" y="1287" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#243746">Готовится и проекция табло</text><polyline points="1660,1306 910,1306" fill="none" stroke="#526675" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="30" y1="1335" x2="2055" y2="1335" stroke="#8396a4" stroke-dasharray="4 4"/><text x="35" y="1349" text-anchor="start" font-family="Arial, sans-serif" font-size="14" fill="#243746">else Пригодность неизвестна</text><text x="1285.0" y="1394" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#243746">Запретить отправку до сверки; сохранить проблему</text><polyline points="1660,1413 910,1413" fill="none" stroke="#526675" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="1090" y="1441" width="740" height="42" rx="4" fill="#fff7d6" stroke="#b8a15d"/><text x="1460.0" y="1461" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#243746">Сверять тот же резерв; после подтверждения пригодности продолжить исходное задание</text><line x1="30" y1="1502" x2="2055" y2="1502" stroke="#8396a4" stroke-dasharray="4 4"/><text x="35" y="1516" text-anchor="start" font-family="Arial, sans-serif" font-size="14" fill="#243746">else Выполнить заказ невозможно</text><text x="1285.0" y="1561" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#243746">Запретить отправку; проблема и полный возврат по A-12</text><polyline points="1660,1580 910,1580" fill="none" stroke="#526675" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="34" y="1034" width="2012" height="577" fill="none" stroke="#8396a4"/><line x1="30" y1="1639" x2="2055" y2="1639" stroke="#8396a4" stroke-dasharray="4 4"/><text x="35" y="1653" text-anchor="start" font-family="Arial, sans-serif" font-size="14" fill="#243746">else Результат неизвестен</text><text x="785.0" y="1698" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#243746">Сохранить ожидание сверки</text><polyline points="660,1717 910,1717" fill="none" stroke="#526675" stroke-width="1.6" marker-end="url(#arrow)"/><text x="535.0" y="1760" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#243746">Проверка оплаты, повтор</text><text x="535.0" y="1779" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#243746">запрещен</text><polyline points="660,1798 410,1798" fill="none" stroke="#526675" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="1535.0" y="1841" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#243746">Проверять исходную попытку</text><text x="1535.0" y="1860" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#243746">каждые 10 с</text><polyline points="1660,1879 1410,1879" fill="none" stroke="#526675" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="590" y="1907" width="1240" height="42" rx="4" fill="#fff7d6" stroke="#b8a15d"/><text x="1210.0" y="1927" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#243746">Через 1 мин уведомить менеджера, резерв не отпускать</text><line x1="30" y1="1968" x2="2055" y2="1968" stroke="#8396a4" stroke-dasharray="4 4"/><text x="35" y="1982" text-anchor="start" font-family="Arial, sans-serif" font-size="14" fill="#243746">else Подтвержден отказ</text><text x="785.0" y="2027" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#243746">Сохранить отказ и задачу</text><text x="785.0" y="2046" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#243746">освобождения резерва</text><polyline points="660,2065 910,2065" fill="none" stroke="#526675" stroke-width="1.6" marker-end="url(#arrow)"/><text x="910.0" y="2108" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#243746">Освободить исходный резерв</text><polyline points="660,2127 1160,2127" fill="none" stroke="#526675" stroke-width="1.6" marker-end="url(#arrow)"/><text x="535.0" y="2170" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#243746">Повтор только после новых</text><text x="535.0" y="2189" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#243746">проверок и разрешенных продаж</text><polyline points="660,2208 410,2208" fill="none" stroke="#526675" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="20" y="660" width="2040" height="1579" fill="none" stroke="#8396a4"/></svg>