<svg xmlns="http://www.w3.org/2000/svg" width="1435" height="1015" viewBox="0 0 1435 1015"><title>Первый релиз — гость и менеджер</title><rect width="100%" height="100%" fill="#f4f6f8"/><text x="25" y="35" font-family="Arial,sans-serif" font-size="25" fill="#203344">Первый релиз — гость и менеджер</text><text x="25" y="65" font-family="Arial,sans-serif" font-size="16" fill="#203344">Схемы экранов. Пример данных; доступность действий определяется сервером.</text><rect x="25" y="90" width="680" height="430" rx="8" fill="white" stroke="#6b8193"/><rect x="25" y="90" width="680" height="45" rx="8" fill="#e1eaf1"/><text x="43" y="119" font-family="Arial,sans-serif" font-size="21" fill="#203344">R-01 Лояльность</text><text x="43" y="170" font-family="Arial,sans-serif" font-size="18" fill="#203344">Регистрация / Вход</text><text x="43" y="196" font-family="Arial,sans-serif" font-size="18" fill="#203344">Телефон • SMS-код</text><text x="43" y="222" font-family="Arial,sans-serif" font-size="18" fill="#203344">Регистрация: имя, дата рождения</text><text x="43" y="248" font-family="Arial,sans-serif" font-size="18" fill="#203344">Email — по желанию</text><text x="43" y="274" font-family="Arial,sans-serif" font-size="18" fill="#203344">Корзина сохраняется</text><rect x="43" y="316" width="644" height="28" rx="4" fill="#eff4f7" stroke="#7891a4"/><text x="55" y="336" font-family="Arial,sans-serif" font-size="16" fill="#203344">Отправить код</text><rect x="43" y="351" width="644" height="28" rx="4" fill="#eff4f7" stroke="#7891a4"/><text x="55" y="371" font-family="Arial,sans-serif" font-size="16" fill="#203344">Подтвердить</text><rect x="43" y="386" width="644" height="28" rx="4" fill="#eff4f7" stroke="#7891a4"/><text x="55" y="406" font-family="Arial,sans-serif" font-size="16" fill="#203344">Продолжить без лояльности</text><rect x="730" y="90" width="680" height="430" rx="8" fill="white" stroke="#6b8193"/><rect x="730" y="90" width="680" height="45" rx="8" fill="#e1eaf1"/><text x="748" y="119" font-family="Arial,sans-serif" font-size="21" fill="#203344">R-02 Бонусы и подарок</text><text x="748" y="170" font-family="Arial,sans-serif" font-size="18" fill="#203344">Баланс: 200 бонусов</text><text x="748" y="196" font-family="Arial,sans-serif" font-size="18" fill="#203344">Списать: 81 бонус (не более 30%)</text><text x="748" y="222" font-family="Arial,sans-serif" font-size="18" fill="#203344">Итого после скидки: 270 ₽ → деньгами 189 ₽</text><text x="748" y="248" font-family="Arial,sans-serif" font-size="18" fill="#203344">Начисление: 9 бонусов</text><text x="748" y="274" font-family="Arial,sans-serif" font-size="18" fill="#203344">Подарок показан только при условиях и наличии</text><rect x="748" y="316" width="644" height="28" rx="4" fill="#eff4f7" stroke="#7891a4"/><text x="760" y="336" font-family="Arial,sans-serif" font-size="16" fill="#203344">Пересчитать и подтвердить</text><rect x="748" y="351" width="644" height="28" rx="4" fill="#eff4f7" stroke="#7891a4"/><text x="760" y="371" font-family="Arial,sans-serif" font-size="16" fill="#203344">К выбору оплаты</text><rect x="25" y="545" width="680" height="430" rx="8" fill="white" stroke="#6b8193"/><rect x="25" y="545" width="680" height="45" rx="8" fill="#e1eaf1"/><text x="43" y="574" font-family="Arial,sans-serif" font-size="21" fill="#203344">R-03 Наличные</text><text x="43" y="625" font-family="Arial,sans-serif" font-size="18" fill="#203344">К оплате: 270 ₽</text><text x="43" y="651" font-family="Arial,sans-serif" font-size="18" fill="#203344">Внесено: 200 ₽ | Осталось: 70 ₽</text><text x="43" y="677" font-family="Arial,sans-serif" font-size="18" fill="#203344">Сдача: по данным устройства</text><text x="43" y="703" font-family="Arial,sans-serif" font-size="18" fill="#203344">Способ доступен при исправном приеме и сдаче</text><text x="43" y="729" font-family="Arial,sans-serif" font-size="18" fill="#203344">Неизвестный возврат — помощь и блокировка</text><rect x="43" y="771" width="644" height="28" rx="4" fill="#eff4f7" stroke="#7891a4"/><text x="55" y="791" font-family="Arial,sans-serif" font-size="16" fill="#203344">Отменить и вернуть неполную сумму</text><rect x="730" y="545" width="680" height="430" rx="8" fill="white" stroke="#6b8193"/><rect x="730" y="545" width="680" height="45" rx="8" fill="#e1eaf1"/><text x="748" y="574" font-family="Arial,sans-serif" font-size="21" fill="#203344">R-04 Полное рабочее место</text><text x="748" y="625" font-family="Arial,sans-serif" font-size="18" fill="#203344">Период • Ресторан • Оплата • Состояние</text><text x="748" y="651" font-family="Arial,sans-serif" font-size="18" fill="#203344">Список покупок и уведомления</text><text x="748" y="677" font-family="Arial,sans-serif" font-size="18" fill="#203344">Карточка покупки: состав, деньги, документы</text><text x="748" y="703" font-family="Arial,sans-serif" font-size="18" fill="#203344">Отмена заказа: отдельно от возврата</text><text x="748" y="729" font-family="Arial,sans-serif" font-size="18" fill="#203344">Возврат: только полный, с подтверждением</text><rect x="748" y="771" width="644" height="28" rx="4" fill="#eff4f7" stroke="#7891a4"/><text x="760" y="791" font-family="Arial,sans-serif" font-size="16" fill="#203344">Найти</text><rect x="748" y="806" width="644" height="28" rx="4" fill="#eff4f7" stroke="#7891a4"/><text x="760" y="826" font-family="Arial,sans-serif" font-size="16" fill="#203344">Отменить по допустимой причине</text><rect x="748" y="841" width="644" height="28" rx="4" fill="#eff4f7" stroke="#7891a4"/><text x="760" y="861" font-family="Arial,sans-serif" font-size="16" fill="#203344">Запустить возврат</text><rect x="748" y="876" width="644" height="28" rx="4" fill="#eff4f7" stroke="#7891a4"/><text x="760" y="896" font-family="Arial,sans-serif" font-size="16" fill="#203344">Проверить исходный возврат</text></svg>