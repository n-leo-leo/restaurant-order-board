<svg xmlns="http://www.w3.org/2000/svg" width="870" height="1470" viewBox="0 0 870 1470"><title>Киоск — MVP</title><rect width="100%" height="100%" fill="#f4f6f8"/><text x="25" y="35" font-family="Arial,sans-serif" font-size="25" fill="#203344">Киоск — MVP</text><text x="25" y="65" font-family="Arial,sans-serif" font-size="16" fill="#203344">Схемы экранов. Пример данных; доступность действий определяется сервером.</text><rect x="25" y="90" width="820" height="430" rx="8" fill="white" stroke="#6b8193"/><rect x="25" y="90" width="820" height="45" rx="8" fill="#e1eaf1"/><text x="43" y="119" font-family="Arial,sans-serif" font-size="21" fill="#203344">K-01 Каталог</text><text x="43" y="170" font-family="Arial,sans-serif" font-size="18" fill="#203344">Категории | Бургеры | Напитки | Комбо</text><text x="43" y="196" font-family="Arial,sans-serif" font-size="18" fill="#203344">Бургер 300 ₽                 [+]</text><text x="43" y="222" font-family="Arial,sans-serif" font-size="18" fill="#203344">Картошка 120 ₽               [+]</text><text x="43" y="248" font-family="Arial,sans-serif" font-size="18" fill="#203344">Только доступные блюда текущего дня</text><text x="43" y="274" font-family="Arial,sans-serif" font-size="18" fill="#203344">Корзина: 1 позиция, 300 ₽</text><rect x="43" y="316" width="784" height="28" rx="4" fill="#eff4f7" stroke="#7891a4"/><text x="55" y="336" font-family="Arial,sans-serif" font-size="16" fill="#203344">Открыть блюдо</text><rect x="43" y="351" width="784" height="28" rx="4" fill="#eff4f7" stroke="#7891a4"/><text x="55" y="371" font-family="Arial,sans-serif" font-size="16" fill="#203344">Посмотреть корзину</text><rect x="43" y="386" width="784" height="28" rx="4" fill="#eff4f7" stroke="#7891a4"/><text x="55" y="406" font-family="Arial,sans-serif" font-size="16" fill="#203344">Начать заново</text><rect x="25" y="545" width="820" height="430" rx="8" fill="white" stroke="#6b8193"/><rect x="25" y="545" width="820" height="45" rx="8" fill="#e1eaf1"/><text x="43" y="574" font-family="Arial,sans-serif" font-size="21" fill="#203344">K-02 Карточка и допродажа</text><text x="43" y="625" font-family="Arial,sans-serif" font-size="18" fill="#203344">Бургер</text><text x="43" y="651" font-family="Arial,sans-serif" font-size="18" fill="#203344">Состав • масса • аллергены</text><text x="43" y="677" font-family="Arial,sans-serif" font-size="18" fill="#203344">Цена 300 ₽       Количество 1</text><text x="43" y="703" font-family="Arial,sans-serif" font-size="18" fill="#203344">Добавить картошку или пирожок?</text><text x="43" y="729" font-family="Arial,sans-serif" font-size="18" fill="#203344">Только по отдельному согласию</text><rect x="43" y="771" width="784" height="28" rx="4" fill="#eff4f7" stroke="#7891a4"/><text x="55" y="791" font-family="Arial,sans-serif" font-size="16" fill="#203344">Добавить в корзину</text><rect x="43" y="806" width="784" height="28" rx="4" fill="#eff4f7" stroke="#7891a4"/><text x="55" y="826" font-family="Arial,sans-serif" font-size="16" fill="#203344">Без дополнения</text><rect x="43" y="841" width="784" height="28" rx="4" fill="#eff4f7" stroke="#7891a4"/><text x="55" y="861" font-family="Arial,sans-serif" font-size="16" fill="#203344">Назад</text><rect x="25" y="1000" width="820" height="430" rx="8" fill="white" stroke="#6b8193"/><rect x="25" y="1000" width="820" height="45" rx="8" fill="#e1eaf1"/><text x="43" y="1029" font-family="Arial,sans-serif" font-size="21" fill="#203344">K-03 Корзина и расчет</text><text x="43" y="1080" font-family="Arial,sans-serif" font-size="18" fill="#203344">Бургер                 [−] 1 [+] [Удалить]</text><text x="43" y="1106" font-family="Arial,sans-serif" font-size="18" fill="#203344">Тип: (●) В зале  ( ) С собой</text><text x="43" y="1132" font-family="Arial,sans-serif" font-size="18" fill="#203344">До скидки: 300 ₽; бизнес-ланч: −30 ₽</text><text x="43" y="1158" font-family="Arial,sans-serif" font-size="18" fill="#203344">Итого: 270 ₽</text><text x="43" y="1184" font-family="Arial,sans-serif" font-size="18" fill="#203344">Цена изменилась? Подтвердите новый расчет</text><rect x="43" y="1226" width="784" height="28" rx="4" fill="#eff4f7" stroke="#7891a4"/><text x="55" y="1246" font-family="Arial,sans-serif" font-size="16" fill="#203344">Проверить заказ</text><rect x="43" y="1261" width="784" height="28" rx="4" fill="#eff4f7" stroke="#7891a4"/><text x="55" y="1281" font-family="Arial,sans-serif" font-size="16" fill="#203344">Подтверждаю 270 ₽, оплатить картой</text><rect x="43" y="1296" width="784" height="28" rx="4" fill="#eff4f7" stroke="#7891a4"/><text x="55" y="1316" font-family="Arial,sans-serif" font-size="16" fill="#203344">К меню</text></svg>