<svg xmlns="http://www.w3.org/2000/svg" width="870" height="1470" viewBox="0 0 870 1470"><title>Оплата, документы и помощь — MVP</title><rect width="100%" height="100%" fill="#f4f6f8"/><text x="25" y="35" font-family="Arial,sans-serif" font-size="25" fill="#203344">Оплата, документы и помощь — MVP</text><text x="25" y="65" font-family="Arial,sans-serif" font-size="16" fill="#203344">Схемы экранов. Пример данных; доступность действий определяется сервером.</text><rect x="25" y="90" width="820" height="430" rx="8" fill="white" stroke="#6b8193"/><rect x="25" y="90" width="820" height="45" rx="8" fill="#e1eaf1"/><text x="43" y="119" font-family="Arial,sans-serif" font-size="21" fill="#203344">K-04 Оплата / неизвестный результат</text><text x="43" y="170" font-family="Arial,sans-serif" font-size="18" fill="#203344">Сумма: 270 ₽</text><text x="43" y="196" font-family="Arial,sans-serif" font-size="18" fill="#203344">Следуйте инструкции терминала</text><text x="43" y="222" font-family="Arial,sans-serif" font-size="18" fill="#203344">Результат неизвестен — проверяем оплату</text><text x="43" y="248" font-family="Arial,sans-serif" font-size="18" fill="#203344">Не оплачивайте повторно</text><text x="43" y="274" font-family="Arial,sans-serif" font-size="18" fill="#203344">Через 1 мин подключается менеджер</text><rect x="43" y="316" width="784" height="28" rx="4" fill="#eff4f7" stroke="#7891a4"/><text x="55" y="336" font-family="Arial,sans-serif" font-size="16" fill="#203344">Помощь менеджера</text><rect x="25" y="545" width="820" height="430" rx="8" fill="white" stroke="#6b8193"/><rect x="25" y="545" width="820" height="45" rx="8" fill="#e1eaf1"/><text x="43" y="574" font-family="Arial,sans-serif" font-size="21" fill="#203344">K-05 Оплата подтверждена</text><text x="43" y="625" font-family="Arial,sans-serif" font-size="18" fill="#203344">Номер заказа: 042</text><text x="43" y="651" font-family="Arial,sans-serif" font-size="18" fill="#203344">Оплачено: 270 ₽</text><text x="43" y="677" font-family="Arial,sans-serif" font-size="18" fill="#203344">Чек: выдан</text><text x="43" y="703" font-family="Arial,sans-serif" font-size="18" fill="#203344">Талон: выдан</text><text x="43" y="729" font-family="Arial,sans-serif" font-size="18" fill="#203344">Заберите оба документа</text><rect x="43" y="771" width="784" height="28" rx="4" fill="#eff4f7" stroke="#7891a4"/><text x="55" y="791" font-family="Arial,sans-serif" font-size="16" fill="#203344">Завершить</text><rect x="25" y="1000" width="820" height="430" rx="8" fill="white" stroke="#6b8193"/><rect x="25" y="1000" width="820" height="45" rx="8" fill="#e1eaf1"/><text x="43" y="1029" font-family="Arial,sans-serif" font-size="21" fill="#203344">K-06 Сбой документов / K-07 Остановка</text><text x="43" y="1080" font-family="Arial,sans-serif" font-size="18" fill="#203344">042 — оплата сохранена</text><text x="43" y="1106" font-family="Arial,sans-serif" font-size="18" fill="#203344">Талон не выдан. Обратитесь к менеджеру</text><text x="43" y="1132" font-family="Arial,sans-serif" font-size="18" fill="#203344">Принятие проблемы: ожидается</text><text x="43" y="1158" font-family="Arial,sans-serif" font-size="18" fill="#203344">При остановке: новые продажи запрещены</text><text x="43" y="1184" font-family="Arial,sans-serif" font-size="18" fill="#203344">Начатая оплата продолжает сверяться</text><rect x="43" y="1226" width="784" height="28" rx="4" fill="#eff4f7" stroke="#7891a4"/><text x="55" y="1246" font-family="Arial,sans-serif" font-size="16" fill="#203344">Помощь менеджера</text><rect x="43" y="1261" width="784" height="28" rx="4" fill="#eff4f7" stroke="#7891a4"/><text x="55" y="1281" font-family="Arial,sans-serif" font-size="16" fill="#203344">Новая оплата недоступна</text></svg>