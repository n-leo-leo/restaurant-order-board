<svg xmlns="http://www.w3.org/2000/svg" width="1330" height="2443" viewBox="0 0 1330 2443"><title>Готовность, выдача и табло</title><metadata>Mermaid source SHA256: 7406c564a53a5680b0b8c90ac9215f225e2bd4c647370c6187c9ea5fbd53f639</metadata><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#526675"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="30" y="36" text-anchor="start" font-family="Arial, sans-serif" font-size="22" fill="#243746">Готовность, выдача и табло</text><line x1="160" y1="115" x2="160" y2="2343" stroke="#cad4dc" stroke-dasharray="5 5"/><rect x="52" y="65" width="216" height="44" rx="5" fill="#edf3f8" stroke="#526675"/><text x="160" y="93" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#243746">Комплекс</text><rect x="52" y="2353" width="216" height="44" rx="5" fill="#edf3f8" stroke="#526675"/><text x="160" y="2381" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#243746">Комплекс</text><line x1="410" y1="115" x2="410" y2="2343" stroke="#cad4dc" stroke-dasharray="5 5"/><rect x="302" y="65" width="216" height="44" rx="5" fill="#edf3f8" stroke="#526675"/><text x="410" y="93" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#243746">Приложение</text><rect x="302" y="2353" width="216" height="44" rx="5" fill="#edf3f8" stroke="#526675"/><text x="410" y="2381" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#243746">Приложение</text><line x1="660" y1="115" x2="660" y2="2343" stroke="#cad4dc" stroke-dasharray="5 5"/><rect x="552" y="65" width="216" height="44" rx="5" fill="#edf3f8" stroke="#526675"/><text x="660" y="93" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#243746">Табло</text><rect x="552" y="2353" width="216" height="44" rx="5" fill="#edf3f8" stroke="#526675"/><text x="660" y="2381" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#243746">Табло</text><line x1="910" y1="115" x2="910" y2="2343" stroke="#cad4dc" stroke-dasharray="5 5"/><rect x="802" y="65" width="216" height="44" rx="5" fill="#edf3f8" stroke="#526675"/><text x="910" y="93" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#243746">Гость</text><rect x="802" y="2353" width="216" height="44" rx="5" fill="#edf3f8" stroke="#526675"/><text x="910" y="2381" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#243746">Гость</text><line x1="1160" y1="115" x2="1160" y2="2343" stroke="#cad4dc" stroke-dasharray="5 5"/><rect x="1052" y="65" width="216" height="44" rx="5" fill="#edf3f8" stroke="#526675"/><text x="1160" y="93" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#243746">Сотрудник</text><rect x="1052" y="2353" width="216" height="44" rx="5" fill="#edf3f8" stroke="#526675"/><text x="1160" y="2381" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#243746">Сотрудник</text><text x="285.0" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#243746">Приготовление завершено</text><polyline points="160,169 410,169" fill="none" stroke="#526675" stroke-width="1.6" marker-end="url(#arrow)"/><text x="285.0" y="212" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#243746">Размещение, увеличение веса,</text><text x="285.0" y="231" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#243746">исправность и ячейка</text><polyline points="160,250 410,250" fill="none" stroke="#526675" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="410,319 480,319 480,345 410,345" fill="none" stroke="#526675" stroke-width="1.6" marker-end="url(#arrow)"/><text x="525" y="297" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#243746">Проверить порядок, назначение и доступ</text><text x="535.0" y="374" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#243746">Получить актуальную проекцию</text><polyline points="660,393 410,393" fill="none" stroke="#526675" stroke-width="1.6" marker-end="url(#arrow)"/><text x="535.0" y="436" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#243746">Готов, ячейка и версия проекции</text><polyline points="410,455 660,455" fill="none" stroke="#526675" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="35" y="498" text-anchor="start" font-family="Arial, sans-serif" font-size="14" fill="#243746">alt Подтверждения показа и применения срока получены</text><text x="535.0" y="543" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#243746">Подтвердить первый показ версии</text><text x="535.0" y="562" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#243746">и его время</text><polyline points="660,581 410,581" fill="none" stroke="#526675" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="410,650 480,650 480,676 410,676" fill="none" stroke="#526675" stroke-width="1.6" marker-end="url(#arrow)"/><text x="525" y="628" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#243746">Сохранить firstReadyAt и expiresAt</text><text x="285.0" y="705" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#243746">Применить expiresAt исходного</text><text x="285.0" y="724" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#243746">назначения</text><polyline points="410,743 160,743" fill="none" stroke="#526675" stroke-width="1.6" marker-end="url(#arrow)"/><text x="285.0" y="786" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#243746">Подтвердить применение срока и</text><text x="285.0" y="805" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#243746">разрешение доступа</text><polyline points="160,824 410,824" fill="none" stroke="#526675" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#arrow)"/><line x1="30" y1="853" x2="1305" y2="853" stroke="#8396a4" stroke-dasharray="4 4"/><text x="35" y="867" text-anchor="start" font-family="Arial, sans-serif" font-size="14" fill="#243746">else Подтверждение показа или применения срока неизвестно</text><polyline points="410,938 480,938 480,964 410,964" fill="none" stroke="#526675" stroke-width="1.6" marker-end="url(#arrow)"/><text x="525" y="916" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#243746">Не разрешать доступ; сохранить проблему</text><text x="535.0" y="993" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#243746">Сверить показ исходной версии</text><polyline points="410,1012 660,1012" fill="none" stroke="#526675" stroke-width="1.6" marker-end="url(#arrow)"/><text x="285.0" y="1055" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#243746">Сверить срок и доступ исходного</text><text x="285.0" y="1074" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#243746">назначения</text><polyline points="410,1093 160,1093" fill="none" stroke="#526675" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="90" y="1121" width="490" height="62" rx="4" fill="#fff7d6" stroke="#b8a15d"/><text x="335.0" y="1141" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#243746">Продолжить только после подтверждений; исходный срок не</text><text x="335.0" y="1161" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#243746">перезапускать</text><rect x="20" y="474" width="1290" height="730" fill="none" stroke="#8396a4"/><text x="535.0" y="1246" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#243746">Действительный талон при подтвержденном доступе</text><polyline points="910,1265 160,1265" fill="none" stroke="#526675" stroke-width="1.6" marker-end="url(#arrow)"/><text x="285.0" y="1308" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#243746">Открытие, затем закрытие и</text><text x="285.0" y="1327" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#243746">измерение</text><polyline points="160,1346 410,1346" fill="none" stroke="#526675" stroke-width="1.6" marker-end="url(#arrow)"/><text x="35" y="1389" text-anchor="start" font-family="Arial, sans-serif" font-size="14" fill="#243746">alt Стабильная пустота после действительной последовательности</text><polyline points="410,1460 480,1460 480,1486 410,1486" fill="none" stroke="#526675" stroke-width="1.6" marker-end="url(#arrow)"/><text x="525" y="1438" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#243746">Выдан, талон погашен, назначение завершено</text><line x1="30" y1="1501" x2="1305" y2="1501" stroke="#8396a4" stroke-dasharray="4 4"/><text x="35" y="1515" text-anchor="start" font-family="Arial, sans-serif" font-size="14" fill="#243746">else Часть осталась до срока</text><polyline points="410,1586 480,1586 480,1612 410,1612" fill="none" stroke="#526675" stroke-width="1.6" marker-end="url(#arrow)"/><text x="525" y="1564" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#243746">Готов, исходный срок сохранен</text><line x1="30" y1="1627" x2="1305" y2="1627" stroke="#8396a4" stroke-dasharray="4 4"/><text x="35" y="1641" text-anchor="start" font-family="Arial, sans-serif" font-size="14" fill="#243746">else Неисправность или неизвестный контроль</text><polyline points="410,1712 480,1712 480,1738 410,1738" fill="none" stroke="#526675" stroke-width="1.6" marker-end="url(#arrow)"/><text x="525" y="1690" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#243746">Проблема, номер скрыт, ячейка заблокирована</text><text x="785.0" y="1767" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#243746">Требуется разбор</text><polyline points="410,1786 1160,1786" fill="none" stroke="#526675" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="20" y="1365" width="1290" height="452" fill="none" stroke="#8396a4"/><text x="35" y="1859" text-anchor="start" font-family="Arial, sans-serif" font-size="14" fill="#243746">opt Истек срок без подтвержденной выдачи</text><text x="285.0" y="1904" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#243746">Запрет новых открытий по талону</text><polyline points="410,1923 160,1923" fill="none" stroke="#526675" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="410,1973 480,1973 480,1999 410,1999" fill="none" stroke="#526675" stroke-width="1.6" marker-end="url(#arrow)"/><text x="525" y="1970" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#243746">Неявка, номер снят</text><text x="785.0" y="2046" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#243746">Убрать остаток</text><polyline points="410,2065 1160,2065" fill="none" stroke="#526675" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="660.0" y="2108" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#243746">Обслужить и закрыть</text><polyline points="1160,2127 160,2127" fill="none" stroke="#526675" stroke-width="1.6" marker-end="url(#arrow)"/><text x="285.0" y="2170" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#243746">Исправная стабильная пустота</text><polyline points="160,2189 410,2189" fill="none" stroke="#526675" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="410,2258 480,2258 480,2284 410,2284" fill="none" stroke="#526675" stroke-width="1.6" marker-end="url(#arrow)"/><text x="525" y="2236" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#243746">Освободить ячейку без регистрации выдачи</text><rect x="20" y="1835" width="1290" height="466" fill="none" stroke="#8396a4"/></svg>