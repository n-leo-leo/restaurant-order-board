<svg xmlns="http://www.w3.org/2000/svg" width="870" height="1470" viewBox="0 0 870 1470"><title>Минимальный экран сотрудника — MVP</title><rect width="100%" height="100%" fill="#f4f6f8"/><text x="25" y="35" font-family="Arial,sans-serif" font-size="25" fill="#203344">Минимальный экран сотрудника — MVP</text><text x="25" y="65" font-family="Arial,sans-serif" font-size="16" fill="#203344">Схемы экранов. Пример данных; доступность действий определяется сервером.</text><rect x="25" y="90" width="820" height="430" rx="8" fill="white" stroke="#6b8193"/><rect x="25" y="90" width="820" height="45" rx="8" fill="#e1eaf1"/><text x="43" y="119" font-family="Arial,sans-serif" font-size="21" fill="#203344">S-00 Вход / S-01 Проблемы</text><text x="43" y="170" font-family="Arial,sans-serif" font-size="18" fill="#203344">Личная учетная запись • Рабочий ресторан</text><text x="43" y="196" font-family="Arial,sans-serif" font-size="18" fill="#203344">Новая проблема: киоск 2, талон не выдан</text><text x="43" y="222" font-family="Arial,sans-serif" font-size="18" fill="#203344">Время доставки • Этап • Ответственный</text><text x="43" y="248" font-family="Arial,sans-serif" font-size="18" fill="#203344">Поиск: ресторан + день + номер</text><text x="43" y="274" font-family="Arial,sans-serif" font-size="18" fill="#203344">Звук и выделение до принятия</text><rect x="43" y="316" width="784" height="28" rx="4" fill="#eff4f7" stroke="#7891a4"/><text x="55" y="336" font-family="Arial,sans-serif" font-size="16" fill="#203344">Войти / Выйти</text><rect x="43" y="351" width="784" height="28" rx="4" fill="#eff4f7" stroke="#7891a4"/><text x="55" y="371" font-family="Arial,sans-serif" font-size="16" fill="#203344">Принять проблему</text><rect x="43" y="386" width="784" height="28" rx="4" fill="#eff4f7" stroke="#7891a4"/><text x="55" y="406" font-family="Arial,sans-serif" font-size="16" fill="#203344">Открыть покупку</text><rect x="25" y="545" width="820" height="430" rx="8" fill="white" stroke="#6b8193"/><rect x="25" y="545" width="820" height="45" rx="8" fill="#e1eaf1"/><text x="43" y="574" font-family="Arial,sans-serif" font-size="21" fill="#203344">S-02 Покупка и помощь</text><text x="43" y="625" font-family="Arial,sans-serif" font-size="18" fill="#203344">042 • Состав • Тип • Оплаченная сумма</text><text x="43" y="651" font-family="Arial,sans-serif" font-size="18" fill="#203344">Заказ: проблема | Оплата: успех</text><text x="43" y="677" font-family="Arial,sans-serif" font-size="18" fill="#203344">Чек: подтвержден | Талон: ошибка</text><text x="43" y="703" font-family="Arial,sans-serif" font-size="18" fill="#203344">Возврат: отдельное состояние</text><text x="43" y="729" font-family="Arial,sans-serif" font-size="18" fill="#203344">Проверка покупки перед печатью обязательна</text><rect x="43" y="771" width="784" height="28" rx="4" fill="#eff4f7" stroke="#7891a4"/><text x="55" y="791" font-family="Arial,sans-serif" font-size="16" fill="#203344">Проверить покупку</text><rect x="43" y="806" width="784" height="28" rx="4" fill="#eff4f7" stroke="#7891a4"/><text x="55" y="826" font-family="Arial,sans-serif" font-size="16" fill="#203344">Напечатать тот же талон</text><rect x="43" y="841" width="784" height="28" rx="4" fill="#eff4f7" stroke="#7891a4"/><text x="55" y="861" font-family="Arial,sans-serif" font-size="16" fill="#203344">Невозможно выполнить</text><rect x="43" y="876" width="784" height="28" rx="4" fill="#eff4f7" stroke="#7891a4"/><text x="55" y="896" font-family="Arial,sans-serif" font-size="16" fill="#203344">Указать ID внешнего возврата</text><rect x="25" y="1000" width="820" height="430" rx="8" fill="white" stroke="#6b8193"/><rect x="25" y="1000" width="820" height="45" rx="8" fill="#e1eaf1"/><text x="43" y="1029" font-family="Arial,sans-serif" font-size="21" fill="#203344">S-03 Ячейки / S-04 Продажи</text><text x="43" y="1080" font-family="Arial,sans-serif" font-size="18" fill="#203344">Ячейка 7: нужна уборка</text><text x="43" y="1106" font-family="Arial,sans-serif" font-size="18" fill="#203344">Дверца • Исправность • Стабильная пустота</text><text x="43" y="1132" font-family="Arial,sans-serif" font-size="18" fill="#203344">Уборка не означает выдачу гостю</text><text x="43" y="1158" font-family="Arial,sans-serif" font-size="18" fill="#203344">Продажи: остановлены • Причина</text><text x="43" y="1184" font-family="Arial,sans-serif" font-size="18" fill="#203344">Начатые оплаты / Заказы / Возвраты</text><rect x="43" y="1226" width="784" height="28" rx="4" fill="#eff4f7" stroke="#7891a4"/><text x="55" y="1246" font-family="Arial,sans-serif" font-size="16" fill="#203344">Зафиксировать обслуживание</text><rect x="43" y="1261" width="784" height="28" rx="4" fill="#eff4f7" stroke="#7891a4"/><text x="55" y="1281" font-family="Arial,sans-serif" font-size="16" fill="#203344">Остановить с причиной</text><rect x="43" y="1296" width="784" height="28" rx="4" fill="#eff4f7" stroke="#7891a4"/><text x="55" y="1316" font-family="Arial,sans-serif" font-size="16" fill="#203344">Возобновить после проверок</text></svg>