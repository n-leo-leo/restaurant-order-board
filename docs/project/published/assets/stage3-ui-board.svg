<svg xmlns="http://www.w3.org/2000/svg" width="870" height="1470" viewBox="0 0 870 1470"><title>Табло и устройство выдачи — MVP</title><rect width="100%" height="100%" fill="#f4f6f8" /><text x="25" y="35" font-family="Arial,sans-serif" font-size="25" fill="#203344">Табло и устройство выдачи — MVP</text><text x="25" y="65" font-family="Arial,sans-serif" font-size="16" fill="#203344">Схемы экранов. Пример данных; доступность действий определяется сервером.</text><rect x="25" y="90" width="820" height="430" rx="8" fill="white" stroke="#6b8193" /><rect x="25" y="90" width="820" height="45" rx="8" fill="#e1eaf1" /><text x="43" y="119" font-family="Arial,sans-serif" font-size="21" fill="#203344">B-01 Публичное табло</text><rect x="25" y="545" width="820" height="430" rx="8" fill="white" stroke="#6b8193" /><rect x="25" y="545" width="820" height="45" rx="8" fill="#e1eaf1" /><text x="43" y="574" font-family="Arial,sans-serif" font-size="21" fill="#203344">B-02 Ячейка выдачи</text><text x="43" y="625" font-family="Arial,sans-serif" font-size="18" fill="#203344">Предъявите талон считывателю</text><text x="43" y="651" font-family="Arial,sans-serif" font-size="18" fill="#203344">Откройте ячейку, заберите заказ, закройте</text><text x="43" y="677" font-family="Arial,sans-serif" font-size="18" fill="#203344">10 минут от первого показа в «Готов»</text><text x="43" y="703" font-family="Arial,sans-serif" font-size="18" fill="#203344">Осталось внутри? Тот же талон до срока</text><text x="43" y="729" font-family="Arial,sans-serif" font-size="18" fill="#203344">Неверный/истекший талон: обратитесь к менеджеру</text><rect x="25" y="1000" width="820" height="430" rx="8" fill="white" stroke="#6b8193" /><rect x="25" y="1000" width="820" height="45" rx="8" fill="#e1eaf1" /><text x="43" y="1029" font-family="Arial,sans-serif" font-size="21" fill="#203344">B-01 Данные недоступны</text><text x="43" y="1080" font-family="Arial,sans-serif" font-size="18" fill="#203344">Данные временно недоступны</text><text x="43" y="1106" font-family="Arial,sans-serif" font-size="18" fill="#203344">Обновление выполняется автоматически</text><text x="43" y="1132" font-family="Arial,sans-serif" font-size="18" fill="#203344">Обратитесь к менеджеру</text><text x="43" y="1158" font-family="Arial,sans-serif" font-size="18" fill="#203344">Дождитесь обновления информации</text><text x="43" y="1184" font-family="Arial,sans-serif" font-size="18" fill="#203344">Если номер исчез, обратитесь к менеджеру</text><rect x="43" y="145" width="365" height="145" rx="4" fill="#f4f7fa" stroke="#7891a4" /><rect x="435" y="145" width="365" height="145" rx="4" fill="#f4f7fa" stroke="#7891a4" /><text x="65" y="176" font-family="Arial,sans-serif" font-size="23" fill="#203344">Готовится</text><text x="65" y="218" font-family="Arial,sans-serif" font-size="21" fill="#203344">041</text><text x="65" y="252" font-family="Arial,sans-serif" font-size="21" fill="#203344">043</text><text x="457" y="176" font-family="Arial,sans-serif" font-size="23" fill="#203344">Готов</text><text x="457" y="218" font-family="Arial,sans-serif" font-size="21" fill="#203344">042 → Ячейка 7</text><text x="457" y="252" font-family="Arial,sans-serif" font-size="21" fill="#203344">044 → Ячейка 2</text><text x="43" y="335" font-family="Arial,sans-serif" font-size="18" fill="#203344">Для получения используйте талон</text><text x="43" y="365" font-family="Arial,sans-serif" font-size="18" fill="#203344">Номер исчез? Обратитесь к менеджеру</text></svg>