<svg xmlns="http://www.w3.org/2000/svg" width="1435" height="1015" viewBox="0 0 1435 1015"><title>Первый релиз — рабочие места</title><rect width="100%" height="100%" fill="#f4f6f8"/><text x="25" y="35" font-family="Arial,sans-serif" font-size="25" fill="#203344">Первый релиз — рабочие места</text><text x="25" y="65" font-family="Arial,sans-serif" font-size="16" fill="#203344">Схемы экранов. Пример данных; доступность действий определяется сервером.</text><rect x="25" y="90" width="680" height="430" rx="8" fill="white" stroke="#6b8193"/><rect x="25" y="90" width="680" height="45" rx="8" fill="#e1eaf1"/><text x="43" y="119" font-family="Arial,sans-serif" font-size="21" fill="#203344">R-05 Меню / ассортимент</text><text x="43" y="170" font-family="Arial,sans-serif" font-size="18" fill="#203344">Будущий торговый день • Версия</text><text x="43" y="196" font-family="Arial,sans-serif" font-size="18" fill="#203344">Позиция: название, категория, состав, цена</text><text x="43" y="222" font-family="Arial,sans-serif" font-size="18" fill="#203344">Акция: условия, дни, время, исключения</text><text x="43" y="248" font-family="Arial,sans-serif" font-size="18" fill="#203344">Комбо: только готовые блюда без циклов</text><text x="43" y="274" font-family="Arial,sans-serif" font-size="18" fill="#203344">Изменения со следующего торгового дня</text><rect x="43" y="316" width="644" height="28" rx="4" fill="#eff4f7" stroke="#7891a4"/><text x="55" y="336" font-family="Arial,sans-serif" font-size="16" fill="#203344">Добавить / Изменить позицию</text><rect x="43" y="351" width="644" height="28" rx="4" fill="#eff4f7" stroke="#7891a4"/><text x="55" y="371" font-family="Arial,sans-serif" font-size="16" fill="#203344">Сохранить цену</text><rect x="43" y="386" width="644" height="28" rx="4" fill="#eff4f7" stroke="#7891a4"/><text x="55" y="406" font-family="Arial,sans-serif" font-size="16" fill="#203344">Сохранить акцию / комбо</text><rect x="730" y="90" width="680" height="430" rx="8" fill="white" stroke="#6b8193"/><rect x="730" y="90" width="680" height="45" rx="8" fill="#e1eaf1"/><text x="748" y="119" font-family="Arial,sans-serif" font-size="21" fill="#203344">R-06 Техкарта / технолог</text><text x="748" y="170" font-family="Arial,sans-serif" font-size="18" fill="#203344">Блюдо • Будущая версия</text><text x="748" y="196" font-family="Arial,sans-serif" font-size="18" fill="#203344">Ингредиент | Точное количество | Единица</text><text x="748" y="222" font-family="Arial,sans-serif" font-size="18" fill="#203344">Параметры приготовления по словарю комплекса</text><text x="748" y="248" font-family="Arial,sans-serif" font-size="18" fill="#203344">Действует со следующего торгового дня</text><text x="748" y="274" font-family="Arial,sans-serif" font-size="18" fill="#203344">Проверьте состав и единицы измерения</text><rect x="748" y="316" width="644" height="28" rx="4" fill="#eff4f7" stroke="#7891a4"/><text x="760" y="336" font-family="Arial,sans-serif" font-size="16" fill="#203344">Открыть карту</text><rect x="748" y="351" width="644" height="28" rx="4" fill="#eff4f7" stroke="#7891a4"/><text x="760" y="371" font-family="Arial,sans-serif" font-size="16" fill="#203344">Сохранить новую версию</text><rect x="25" y="545" width="680" height="430" rx="8" fill="white" stroke="#6b8193"/><rect x="25" y="545" width="680" height="45" rx="8" fill="#e1eaf1"/><text x="43" y="574" font-family="Arial,sans-serif" font-size="21" fill="#203344">R-07 Производство</text><text x="43" y="625" font-family="Arial,sans-serif" font-size="18" fill="#203344">Робот | Состояние | Ошибка</text><text x="43" y="651" font-family="Arial,sans-serif" font-size="18" fill="#203344">Полуфабрикат | Остаток | Единица | %</text><text x="43" y="677" font-family="Arial,sans-serif" font-size="18" fill="#203344">Ниже 30% — требуется пополнение</text><text x="43" y="703" font-family="Arial,sans-serif" font-size="18" fill="#203344">Оценка времени окончания, если известна</text><text x="43" y="729" font-family="Arial,sans-serif" font-size="18" fill="#203344">Время данных; устаревание явно показано</text><rect x="730" y="545" width="680" height="430" rx="8" fill="white" stroke="#6b8193"/><rect x="730" y="545" width="680" height="45" rx="8" fill="#e1eaf1"/><text x="748" y="574" font-family="Arial,sans-serif" font-size="21" fill="#203344">R-08 Аналитик / продажи и 1С</text><text x="748" y="625" font-family="Arial,sans-serif" font-size="18" fill="#203344">Ресторан • Период [с, до)</text><text x="748" y="651" font-family="Arial,sans-serif" font-size="18" fill="#203344">Число заказов • До скидок • Скидки</text><text x="748" y="677" font-family="Arial,sans-serif" font-size="18" fill="#203344">Деньги • Бонусы • Подтвержденные возвраты</text><text x="748" y="703" font-family="Arial,sans-serif" font-size="18" fill="#203344">Итог: деньги минус возвраты</text><text x="748" y="729" font-family="Arial,sans-serif" font-size="18" fill="#203344">Пакет закрытого дня: ID и состояние</text><rect x="748" y="771" width="644" height="28" rx="4" fill="#eff4f7" stroke="#7891a4"/><text x="760" y="791" font-family="Arial,sans-serif" font-size="16" fill="#203344">Показать отчет</text><rect x="748" y="806" width="644" height="28" rx="4" fill="#eff4f7" stroke="#7891a4"/><text x="760" y="826" font-family="Arial,sans-serif" font-size="16" fill="#203344">Передать закрытый день</text><rect x="748" y="841" width="644" height="28" rx="4" fill="#eff4f7" stroke="#7891a4"/><text x="760" y="861" font-family="Arial,sans-serif" font-size="16" fill="#203344">Проверить пакет</text></svg>