site_name: "Робот и точка: приложение для заказа + табло"
site_description: Проектная работа курса «Системный аналитик»
site_url: https://n-leo-leo.github.io/restaurant-order-board/
docs_dir: docs/project/published
site_dir: site

theme:
  name: material
  language: ru
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
  - toc:
      permalink: true
  - attr_list

nav:
  - О проекте: index.md
  - Этапы подготовки: stages.md
  - 1. Бизнес-требования:
      - Цели и требования бизнеса: 01_business/goals.md
      - Метрики: 01_business/metrics.md
      - Роли и границы системы: 01_business/scope.md
      - Бизнес-процессы: 01_business/processes.md
  - 2. Требования к приложению:
      - Карта историй: 02_requirements/story-map.md
      - Пользовательские истории: 02_requirements/user-stories.md
      - НФТ: 02_requirements/nfr.md
      - Ограничения и допущения: 02_requirements/assumptions.md
