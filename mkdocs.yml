site_name: "Робот и точка: приложение для заказа + табло"
site_description: Проектная работа курса «Системный аналитик»
site_url: https://n-leo-leo.github.io/restaurant-order-board/
docs_dir: docs/project/published
site_dir: site

theme:
  name: material
  language: ru
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
  - toc:
      permalink: true
  - attr_list

nav:
  - О проекте: index.md
  - Этапы подготовки: stages.md
