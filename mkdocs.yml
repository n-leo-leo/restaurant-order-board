site_name: "Робот и точка: приложение для заказа + табло"
site_description: Проектная работа курса «Системный аналитик»
site_url: https://n-leo-leo.github.io/restaurant-order-board/
docs_dir: docs/project/published
site_dir: site

hooks:
  - scripts/publication.py
  - scripts/swagger_ui.py

theme:
  name: material
  language: ru
  features:
    - navigation.top
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
  - toc:
      permalink: true
  - attr_list

nav:
  - О проекте: index.md
  - Этапы подготовки: stages.md
  - Глоссарий: glossary.md
  - 1. Бизнес-требования:
      - Цели и требования бизнеса: 01_business/goals.md
      - Метрики: 01_business/metrics.md
      - Роли и границы системы: 01_business/scope.md
      - Бизнес-процессы: 01_business/processes.md
  - 2. Требования к приложению:
      - Карта историй: 02_requirements/story-map.md
      - Пользовательские истории: 02_requirements/user-stories.md
      - НФТ: 02_requirements/nfr.md
      - Ограничения и допущения: 02_requirements/assumptions.md

  - 3. Информационная модель:
      - Диаграмма классов: 03_model/class-diagram.md
      - Сущности и ограничения: 03_model/entities.md
      - Состояния заказа: 03_model/order-states.md
  - 4. Архитектура:
      - Архитектурный стиль: 04_architecture/style.md
      - Компоненты и размещение: 04_architecture/components.md
      - Внешние системы: 04_architecture/integrations.md
      - Схемы интеграций: 04_architecture/integration-flows.md
      - Нагрузка и СУБД: 04_architecture/load-db.md
  - 5. Интерфейсы и API:
      - Интерфейсы и макеты: 05_api/ui.md
      - Ресурсы и операции: 05_api/resources.md
      - Прототипы экранов: 05_api/prototypes.md
      - Swagger UI и OpenAPI: 05_api/openapi.md
      - Контракты адаптеров: 05_api/adapter-contracts.md
